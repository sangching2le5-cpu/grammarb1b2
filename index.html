<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện Ngữ Pháp B1–B2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; color: #1a202c; padding: 16px;
  }
  .container { max-width: 860px; margin: 0 auto; }
  header {
    text-align: center; color: #fff; margin-bottom: 24px; padding: 20px;
  }
  header h1 { font-size: 1.8rem; margin-bottom: 6px; }
  header p { opacity: .9; font-size: .95rem; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15); margin-bottom: 16px;
  }
  .topic-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .topic-card {
    background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: all .2s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .topic-card:hover { border-color: #667eea; background: #eef2ff; transform: translateY(-2px); }
  .topic-card .group { font-size: .72rem; color: #718096; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .topic-card .name { font-weight: 600; font-size: .95rem; color: #2d3748; }
  .topic-card .count { font-size: .8rem; color: #667eea; font-weight: 500; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: #667eea; color: #fff; border: none; padding: 12px 22px;
    border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: all .2s; text-decoration: none;
  }
  .btn:hover { background: #5a67d8; transform: translateY(-1px); }
  .btn.secondary { background: #edf2f7; color: #4a5568; }
  .btn.secondary:hover { background: #e2e8f0; }
  .btn.danger { background: #e53e3e; }
  .btn.danger:hover { background: #c53030; }
  .btn.success { background: #38a169; }
  .btn.success:hover { background: #2f855a; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  .big-test-btn {
    width: 100%; padding: 20px; font-size: 1.1rem;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  }
  .big-test-btn:hover { background: linear-gradient(135deg, #ec84f5 0%, #f0465c 100%); }

  .progress-bar {
    height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar > div {
    height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width .3s ease;
  }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: .85rem; color: #718096; }
  .q-text { font-size: 1.15rem; line-height: 1.6; margin-bottom: 18px; font-weight: 500; color: #1a202c; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px;
    padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 12px;
    transition: all .15s; font-size: 1rem; text-align: left; font-family: inherit;
    color: #1a202c;
  }
  .option:hover:not(:disabled) { border-color: #667eea; background: #eef2ff; }
  .option .letter {
    width: 28px; height: 28px; border-radius: 50%; background: #cbd5e0; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: .85rem; flex-shrink: 0;
  }
  .option.correct { background: #f0fff4; border-color: #38a169; }
  .option.correct .letter { background: #38a169; }
  .option.wrong { background: #fff5f5; border-color: #e53e3e; }
  .option.wrong .letter { background: #e53e3e; }
  .option.selected { border-color: #667eea; background: #eef2ff; }
  .option:disabled { cursor: default; }

  .explanation {
    margin-top: 18px; padding: 14px 18px; border-radius: 10px;
    background: #fffaf0; border-left: 4px solid #ed8936; font-size: .95rem;
    line-height: 1.55;
  }
  .explanation strong { color: #c05621; }

  .result-summary {
    text-align: center; padding: 24px;
  }
  .result-summary .score {
    font-size: 3.5rem; font-weight: 800;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-summary .label { font-size: 1rem; color: #718096; margin-bottom: 12px; }
  .result-summary .msg { font-size: 1.1rem; font-weight: 600; color: #2d3748; margin-top: 8px; }

  .review-item {
    background: #f7fafc; border-radius: 10px; padding: 14px 18px; margin-bottom: 12px;
    border-left: 4px solid #cbd5e0; font-size: .92rem; line-height: 1.5;
  }
  .review-item.ok { border-left-color: #38a169; }
  .review-item.bad { border-left-color: #e53e3e; }
  .review-item .rq { font-weight: 600; margin-bottom: 6px; color: #2d3748; }
  .review-item .ra { margin: 3px 0; }
  .review-item .ra.correct { color: #2f855a; }
  .review-item .ra.wrong { color: #c53030; }
  .review-item .re { color: #4a5568; font-style: italic; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #cbd5e0; }

  .status-pill {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-size: .75rem; font-weight: 600;
  }
  .pill-test { background: #fed7e2; color: #97266d; }
  .pill-practice { background: #c6f6d5; color: #22543d; }

  .q-nav {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 6px; margin: 16px 0;
  }
  .q-nav button {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid #cbd5e0;
    background: #fff; cursor: pointer; font-size: .85rem; font-weight: 600;
    color: #4a5568;
  }
  .q-nav button.answered { background: #bee3f8; border-color: #4299e1; color: #2c5282; }
  .q-nav button.current { outline: 3px solid #667eea; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .card { padding: 18px; }
    .q-text { font-size: 1rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 Luyện Ngữ Pháp B1–B2</h1>
    <p>Chọn chủ điểm để luyện tập, hoặc làm bài kiểm tra 40 câu ngẫu nhiên</p>
  </header>

  <!-- ==================== HOME ==================== -->
  <div id="home-view">
    <div class="card">
      <button class="btn big-test-btn" onclick="startTest()">
        🎯 BẮT ĐẦU BÀI KIỂM TRA 40 CÂU NGẪU NHIÊN
      </button>
    </div>

    <div class="card">
      <h2 style="margin-bottom:14px;font-size:1.1rem;">📖 Luyện theo chủ điểm</h2>
      <div class="topic-grid" id="topic-grid"></div>
    </div>
  </div>

  <!-- ==================== PRACTICE ==================== -->
  <div id="practice-view" class="hidden">
    <div class="card">
      <div class="q-meta">
        <span id="p-topic-name" style="font-weight:600;color:#667eea;"></span>
        <span><span class="status-pill pill-practice">LUYỆN TẬP</span></span>
      </div>
      <div class="progress-bar"><div id="p-progress"></div></div>
      <div class="q-meta">
        <span>Câu <b id="p-cur">1</b> / <span id="p-total">0</span></span>
        <span>Đúng: <b id="p-score" style="color:#38a169;">0</b></span>
      </div>
      <div class="q-text" id="p-question"></div>
      <div class="options" id="p-options"></div>
      <div class="explanation hidden" id="p-exp"></div>
      <div class="btn-row">
        <button class="btn secondary" onclick="goHome()">← Trang chủ</button>
        <button class="btn" id="p-next" disabled onclick="practiceNext()">Câu tiếp →</button>
      </div>
    </div>
  </div>

  <!-- ==================== TEST ==================== -->
  <div id="test-view" class="hidden">
    <div class="card">
      <div class="q-meta">
        <span style="font-weight:600;color:#e53e3e;">📝 KIỂM TRA 40 CÂU — Ngẫu nhiên</span>
        <span><span class="status-pill pill-test">TEST</span></span>
      </div>
      <div class="progress-bar"><div id="t-progress"></div></div>
      <div class="q-meta">
        <span>Câu <b id="t-cur">1</b> / 40</span>
        <span>Đã trả lời: <b id="t-answered">0</b> / 40</span>
      </div>
      <div class="q-text" id="t-question"></div>
      <div class="options" id="t-options"></div>
      <div class="q-nav" id="t-nav"></div>
      <div class="btn-row">
        <button class="btn secondary" onclick="goHome()">← Trang chủ</button>
        <button class="btn secondary" id="t-prev" onclick="testPrev()">← Câu trước</button>
        <button class="btn" id="t-next" onclick="testNext()">Câu tiếp →</button>
        <button class="btn success hidden" id="t-submit" onclick="submitTest()">✅ NỘP BÀI</button>
      </div>
    </div>
  </div>

  <!-- ==================== RESULT ==================== -->
  <div id="result-view" class="hidden">
    <div class="card result-summary">
      <div class="label">Kết quả của bạn</div>
      <div class="score"><span id="r-score">0</span> / 40</div>
      <div class="msg" id="r-msg"></div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" onclick="startTest()">🔁 Làm lại</button>
        <button class="btn secondary" onclick="goHome()">← Trang chủ</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:14px;font-size:1.1rem;">📋 Xem lại & giải thích</h2>
      <div id="r-list"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DỮ LIỆU CÂU HỎI
   Format: [câu hỏi, [A,B,C,D], chỉ số đáp án đúng, giải thích]

const T = [
/* ---------- GIỚI TỪ ---------- */

]},

["I'll call you ___ next Monday.",["on","at","in","—"],3,"Trước 'next Monday' không dùng giới từ."],
["We moved here ___ last June.",["at","in","on","—"],3,"Trước 'last June' không dùng giới từ."],
["She goes swimming ___ every Saturday.",["at","on","in","—"],3,"Trước 'every Saturday' không dùng giới từ."],
["I'll see you ___ Friday.",["at","on","in","by"],1,"'on' + thứ trong tuần (on Friday)."],

]},

["I got home ___ time for dinner.",["on","in","at","by"],1,"'in time for' = kịp cho việc gì."],
["___ the end of the film, everyone left.",["In","On","At","By"],2,"'at the end of' = ở cuối (thời điểm)."],

["I'll meet you ___ the bus stop.",["in","on","at","by"],2,"'at' dùng cho điểm hẹn cụ thể."],

["I read about it ___ the newspaper.",["at","in","on","by"],1,"'in the newspaper' = trên báo."],

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function randomizeQuestion(q){
  const [text, opts, ansIdx, exp] = q;
  const pairs = opts.map((o,i)=>({o, correct: i===ansIdx}));
  const sh = shuffle(pairs);
  const newOpts = sh.map(p=>p.o);
  const newAns = sh.findIndex(p=>p.correct);
  return { text, opts: newOpts, ans: newAns, exp };
}

// Đếm tổng số câu
const totalQuestions = T.reduce((s,t)=>s+t.qs.length,0);
document.getElementById('topic-grid').innerHTML = T.map((t, i)=>{
  return `<div class="topic-card" onclick="startPractice(${i})">
    <div class="group">${t.group}</div>
    <div class="name">${t.name}</div>
    <div class="count">${t.qs.length} câu</div>
  </div>`;
}).join('');

/* ---------- Điều hướng view ---------- */
function show(id){ ['home-view','practice-view','test-view','result-view'].forEach(v=>{
  document.getElementById(v).classList.toggle('hidden', v!==id);
});
  window.scrollTo({top:0, behavior:'smooth'});
}
function goHome(){ show('home-view'); }

/* ==================== PRACTICE ==================== */
let pState = null;

function startPractice(topicIdx){
  const topic = T[topicIdx];
  const qs = shuffle(topic.qs.map(randomizeQuestion));
  pState = { topic, qs, idx:0, score:0, answered:false, chosen:null };
  document.getElementById('p-topic-name').textContent = topic.name;
  document.getElementById('p-total').textContent = qs.length;
  show('practice-view');
  renderPractice();
}

function renderPractice(){
  const s = pState;
  const q = s.qs[s.idx];
  document.getElementById('p-cur').textContent = s.idx+1;
  document.getElementById('p-score').textContent = s.score;
  document.getElementById('p-progress').style.width = ((s.idx)/s.qs.length*100)+'%';
  document.getElementById('p-question').innerHTML = q.text.replace(/_+/g,'<u>&nbsp;&nbsp;&nbsp;&nbsp;</u>');
  const optEl = document.getElementById('p-options');
  optEl.innerHTML = '';
  q.opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.onclick = ()=> practiceAnswer(i);
    optEl.appendChild(btn);
  });
  const expEl = document.getElementById('p-exp');
  expEl.classList.add('hidden');
  expEl.innerHTML = '';
  document.getElementById('p-next').disabled = true;
  const nextBtn = document.getElementById('p-next');
  nextBtn.textContent = (s.idx === s.qs.length-1) ? '✔️ Hoàn thành' : 'Câu tiếp →';
  s.answered = false;
}

function practiceAnswer(choice){
  const s = pState;
  if(s.answered) return;
  s.answered = true;
  s.chosen = choice;
  const q = s.qs[s.idx];
  const optEl = document.getElementById('p-options');
  const btns = optEl.querySelectorAll('.option');
  btns.forEach((b,i)=>{
    b.disabled = true;
    if(i === q.ans) b.classList.add('correct');
    else if(i === choice) b.classList.add('wrong');
  });
  if(choice === q.ans) s.score++;
  document.getElementById('p-score').textContent = s.score;
  const expEl = document.getElementById('p-exp');
  expEl.classList.remove('hidden');
  const correctLetter = 'ABCD'[q.ans];
  const yourLetter = 'ABCD'[choice];
  const isOk = choice === q.ans;
  expEl.innerHTML = `<strong>${isOk?'✅ Chính xác!':'❌ Chưa đúng.'}</strong> 
    Đáp án đúng: <b>${correctLetter}. ${q.opts[q.ans]}</b>
    ${isOk?'':` — Bạn chọn: <i>${yourLetter}. ${q.opts[choice]}</i>`}
    <br><br>💡 <b>Giải thích:</b> ${q.exp}`;
  document.getElementById('p-next').disabled = false;
}

function practiceNext(){
  const s = pState;
  if(s.idx === s.qs.length-1){
    alert(`🎉 Hoàn thành! Bạn đúng ${s.score}/${s.qs.length} câu (${Math.round(s.score/s.qs.length*100)}%).`);
    goHome();
    return;
  }
  s.idx++;
  renderPractice();
}

/* ==================== TEST ==================== */
const TEST_COUNT = 40;
let tState = null;

function startTest(){
  // Lấy tất cả câu từ tất cả topic
  const all = [];
  T.forEach(topic=>{
    topic.qs.forEach(q=> all.push(q));
  });
  const picked = shuffle(all).slice(0, TEST_COUNT).map(randomizeQuestion);
  tState = {
    qs: picked,
    idx: 0,
    answers: new Array(picked.length).fill(null),
    submitted: false
  };
  show('test-view');
  renderTest();
}

function renderTest(){
  const s = tState;
  const q = s.qs[s.idx];
  document.getElementById('t-cur').textContent = s.idx+1;
  const answeredCount = s.answers.filter(a=>a!==null).length;
  document.getElementById('t-answered').textContent = answeredCount;
  document.getElementById('t-progress').style.width = ((s.idx+1)/s.qs.length*100)+'%';
  document.getElementById('t-question').innerHTML = q.text.replace(/_+/g,'<u>&nbsp;&nbsp;&nbsp;&nbsp;</u>');
  const optEl = document.getElementById('t-options');
  optEl.innerHTML = '';
  q.opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    if(s.answers[s.idx] === i) btn.classList.add('selected');
    btn.innerHTML = `<span class="letter">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.onclick = ()=> testChoose(i);
    optEl.appendChild(btn);
  });

  // Nav
  const nav = document.getElementById('t-nav');
  nav.innerHTML = '';
  for(let i=0;i<s.qs.length;i++){
    const b = document.createElement('button');
    b.textContent = i+1;
    if(s.answers[i]!==null) b.classList.add('answered');
    if(i===s.idx) b.classList.add('current');
    b.onclick = ()=>{ tState.idx = i; renderTest(); };
    nav.appendChild(b);
  }

  // Buttons
  document.getElementById('t-prev').disabled = s.idx === 0;
  document.getElementById('t-next').classList.toggle('hidden', s.idx === s.qs.length-1);
  document.getElementById('t-submit').classList.toggle('hidden', s.idx !== s.qs.length-1 || s.submitted);
}

function testChoose(i){
  if(tState.submitted) return;
  tState.answers[tState.idx] = i;
  renderTest();
}
function testPrev(){ if(tState.idx>0){ tState.idx--; renderTest(); } }
function testNext(){
  if(tState.idx < tState.qs.length-1){
    if(tState.answers[tState.idx]===null){
      if(!confirm('Bạn chưa trả lời câu này. Vẫn tiếp tục?')) return;
    }
    tState.idx++; renderTest();
  }
}

function submitTest(){
  const s = tState;
  const unanswered = s.answers.filter(a=>a===null).length;
  if(unanswered > 0){
    if(!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`)) return;
  } else {
    if(!confirm('Nộp bài và xem kết quả?')) return;
  }
  s.submitted = true;
  // Tính điểm
  let score = 0;
  const reviewList = [];
  s.qs.forEach((q,i)=>{
    const chosen = s.answers[i];
    const isOk = chosen === q.ans;
    if(isOk) score++;
    reviewList.push({q, chosen, isOk});
  });
  document.getElementById('r-score').textContent = score;
  let msg = '';
  const pct = score/s.qs.length*100;
  if(pct >= 90) msg = '🌟 Xuất sắc! Bạn nắm ngữ pháp rất vững.';
  else if(pct >= 75) msg = '👍 Tốt lắm! Tiếp tục phát huy.';
  else if(pct >= 60) msg = '🙂 Khá ổn. Cần luyện thêm vài chủ điểm.';
  else if(pct >= 40) msg = '💪 Cố gắng lên! Ôn lại các chủ điểm yếu.';
  else msg = '📚 Hãy luyện tập nhiều hơn nhé!';
  document.getElementById('r-msg').textContent = msg;

  const listEl = document.getElementById('r-list');
  listEl.innerHTML = reviewList.map((r,i)=>{
    const q = r.q;
    const correctL = 'ABCD'[q.ans];
    const yourL = r.chosen !== null ? 'ABCD'[r.chosen] : '—';
    const yourText = r.chosen !== null ? q.opts[r.chosen] : '(chưa trả lời)';
    return `<div class="review-item ${r.isOk?'ok':'bad'}">
      <div class="rq">Câu ${i+1}: ${q.text.replace(/_+/g,'____')}</div>
      <div class="ra correct">✅ Đáp án đúng: <b>${correctL}. ${q.opts[q.ans]}</b></div>
      <div class="ra ${r.isOk?'correct':'wrong'}">${r.isOk?'✔️':'❌'} Bạn chọn: <b>${yourL}. ${yourText}</b></div>
      <div class="re">💡 ${q.exp}</div>
    </div>`;
  }).join('');

  show('result-view');
}

/* Khởi động */
console.log(`Tổng số câu hỏi trong ngân hàng: ${totalQuestions}`);
